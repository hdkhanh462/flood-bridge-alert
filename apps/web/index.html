<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    />
    <title>Cầu An</title>
    <meta name="description" content="Cầu An is a web application" />
    <!-- Thiếu tag này khiến Android chỉ giả định trang luôn ở chế độ sáng,
    nên khi status bar (theme-color) đổi sang màu tối, icon/chữ hệ thống vẫn
    giữ màu tối theo mặc định — gây ra tình trạng nền đen chữ đen. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0c" />
  </head>

server {
	listen 3000;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# File trong /assets/ có hash nội dung trong tên (vd index-D69Xv3vr.js) nên
	# đổi nội dung là đổi luôn tên — cache dài hạn tuyệt đối an toàn.
	location ^~ /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# Các file còn lại (sw.js, manifest.webmanifest, icon, favicon, logo, index.html)
	# giữ NGUYÊN TÊN qua mỗi lần deploy — nếu để CDN/trình duyệt cache dài hạn,
	# deploy bản mới xong vẫn phục vụ nhầm bản cũ hàng giờ (đã gặp thật với
	# sw.js và icon PWA bị Cloudflare cache 4 tiếng dù server đã có bản mới).
	# no-cache bắt buộc revalidate mỗi lần bằng ETag/Last-Modified, vẫn rẻ vì
	# trả 304 khi không đổi, không phải tải lại full file.
	location / {
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri/ /index.html;
	}
}
